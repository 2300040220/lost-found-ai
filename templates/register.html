{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="panel">
      <h2 class="h4 mb-3">Create your account</h2>
      <form method="post" novalidate>
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <label class="form-label" for="name">Full name</label>
        <input class="form-control mb-3" id="name" name="name" value="{{ form.get('name','') }}" required>
        <label class="form-label" for="email">Email</label>
        <input class="form-control mb-3" id="email" name="email" type="email" value="{{ form.get('email','') }}" required>
        <label class="form-label" for="phone">Phone (optional)</label>
        <input class="form-control mb-3" id="phone" name="phone" value="{{ form.get('phone','') }}">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
        <div class="form-text mb-3">At least 8 characters, with a letter and a number.</div>
        <label class="form-label" for="confirm">Confirm password</label>
        <input class="form-control mb-3" id="confirm" name="confirm" type="password" required>
        <button class="btn btn-primary w-100">Create account</button>
      </form>
      <p class="small mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
  </div>
</div>
{% endblock %}
